<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Kameti – Live Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3d3a;--panel:#14504b;--ink:#f5efe0;--muted:#a9c4bd;--gold:#e8a317;--brick:#b5452b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh;padding:20px 16px 40px}
main{max-width:640px;margin:0 auto;text-align:center}
h1{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;margin:4px 0}
.sub{color:var(--muted);margin:0 0 18px}
.stage{position:relative;width:min(92vw,520px);margin:0 auto}
canvas{width:100%;height:auto;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));z-index:2}
button{font:inherit;font-weight:800;font-size:1.15rem;background:var(--gold);color:#2a1d00;border:0;border-radius:999px;padding:14px 42px;margin:22px 0 10px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.result{min-height:92px;background:var(--panel);border-radius:14px;padding:14px;margin:8px 0 22px}
.result .who{font-size:clamp(1.6rem,7vw,2.6rem);font-weight:800;color:var(--gold)}
.result .note{color:var(--muted)}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
@media(max-width:480px){.lists{grid-template-columns:1fr}}
.box{background:var(--panel);border-radius:14px;padding:12px 14px}
.box h2{font-size:1rem;margin:0 0 8px}
.box ul{margin:0;padding-left:18px;color:var(--muted);font-size:.95rem}
.box li b{color:var(--ink);font-weight:600}
.foot{color:var(--muted);font-size:.85rem;margin-top:18px}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="stage"><div class="pointer"></div><canvas id="wheel" width="1040" height="1040" aria-label="Kameti wheel"></canvas></div>
  <button id="spin">Spin karein</button>
  <div class="result" id="result" aria-live="polite"><div class="note">Spin dabayen, sab ke samne naam niklega.</div></div>
  <div class="lists">
    <div class="box"><h2 id="remH"></h2><ul id="rem"></ul></div>
    <div class="box"><h2>Kameti mil chuki</h2><ul id="won"></ul></div>
  </div>
  <p class="foot">Naam browser ke secure random number generator se chuna jata hai.</p>
</main>

<script>
/* ====== YAHAN SE EDIT KAREIN ====== */
const TITLE   = "Gym Kameti";
const AMOUNT  = "5,00,000";                 // total kameti
const MONTH   = "Draw: Month 1";            // har mahine badlein
const MEMBERS = [                           // 20 members ke asal naam yahan likhein
  "Ali","Ahmed","Bilal","Hamza","Usman","Hassan","Zain","Talha","Faisal","Imran",
  "Kamran","Nadeem","Omar","Saad","Shahid","Waqas","Yasir","Zubair","Danish","Rizwan"
];
const WINNERS = [                           // har draw ke baad yahan add karein
  // {name:"Ali", month:"Month 1"},
];
/* ====== EDIT KHATAM ====== */

const won = new Set(WINNERS.map(w => w.name));
const pool = MEMBERS.filter(n => !won.has(n));
const COLORS = ["#e8a317","#b5452b","#1d7a70","#f5efe0","#6b3fa0"];
const TXT    = ["#2a1d00","#fff","#fff","#14302d","#fff"];

document.getElementById("title").textContent = TITLE + " – " + AMOUNT;
document.getElementById("sub").textContent = MONTH + " · " + pool.length + " naam wheel mein";
document.getElementById("remH").textContent = "Abhi baqi (" + pool.length + ")";
document.getElementById("rem").innerHTML = pool.map(n => "<li>" + esc(n) + "</li>").join("");
document.getElementById("won").innerHTML = WINNERS.length
  ? WINNERS.map(w => "<li><b>" + esc(w.name) + "</b> – " + esc(w.month) + "</li>").join("")
  : "<li>Abhi koi nahi</li>";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

const cv = document.getElementById("wheel"), ctx = cv.getContext("2d");
const S = cv.width, R = S/2 - 8, TAU = Math.PI*2;
let rot = 0, spinning = false;

function draw(){
  const n = pool.length;
  ctx.clearRect(0,0,S,S);
  ctx.save(); ctx.translate(S/2,S/2);
  if(!n){ctx.fillStyle="#f5efe0";ctx.font="700 48px sans-serif";ctx.textAlign="center";ctx.fillText("Kameti mukammal!",0,0);ctx.restore();return;}
  const seg = TAU/n;
  for(let i=0;i<n;i++){
    const a0 = rot + i*seg, a1 = a0 + seg;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
    ctx.fillStyle = COLORS[i%COLORS.length]; ctx.fill();
    ctx.strokeStyle = "#0f3d3a"; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.rotate(a0 + seg/2); ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = TXT[i%TXT.length];
    ctx.font = "700 " + Math.max(22, Math.min(44, 520/n*1.1)) + "px 'Bricolage Grotesque',sans-serif";
    ctx.fillText(pool[i], R-28, 0); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0,0,46,0,TAU); ctx.fillStyle="#0f3d3a"; ctx.fill();
  ctx.lineWidth=6; ctx.strokeStyle="#e8a317"; ctx.stroke();
  ctx.restore();
}

function secureRandom(){ const a = new Uint32Array(2); crypto.getRandomValues(a); return (a[0]*4294967296 + a[1]) / 18446744073709551616; }

function spin(){
  if(spinning || !pool.length) return;
  spinning = true;
  const btn = document.getElementById("spin"); btn.disabled = true;
  const res = document.getElementById("result");
  res.innerHTML = '<div class="note">Wheel ghoom raha hai…</div>';
  const n = pool.length, seg = TAU/n;
  const win = Math.floor(secureRandom()*n);
  const jitter = (secureRandom()-0.5)*seg*0.7;
  const target = -Math.PI/2 - (win+0.5)*seg + jitter;
  const start = rot;
  const delta = (((target-start)%TAU)+TAU)%TAU + TAU*(6+Math.floor(secureRandom()*3));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = reduce ? 800 : 7000;
  const t0 = performance.now();
  (function frame(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,4);
    rot = start + delta*e; draw();
    if(p<1) requestAnimationFrame(frame);
    else {
      spinning = false; btn.disabled = false;
      res.innerHTML = '<div class="note">' + esc(MONTH) + ' ka winner</div><div class="who">' + esc(pool[win]) + '</div><div class="note">Mubarak ho! Ab ' + esc(pool[win]) + ' ko WINNERS list mein add karein.</div>';
    }
  })(t0);
}
document.getElementById("spin").addEventListener("click", spin);
draw();
</script>
</body>
</html>
